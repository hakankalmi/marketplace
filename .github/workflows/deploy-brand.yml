name: Deploy Marketplace Brand

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand code to deploy'
        required: true
        type: string

env:
  SERVER_IP: 37.27.203.254
  DEPLOY_PATH: /opt/marketplace

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for brand
        run: npm run build
        env:
          NEXT_PUBLIC_BRAND_CODE: ${{ inputs.brand }}
          NEXT_PUBLIC_API_URL: https://api.protakip.com

      - name: Prepare standalone package
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          rm -rf deploy/.next/static
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

      - name: Clean old build on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf ${{ env.DEPLOY_PATH }}/builds/${{ inputs.brand }}/.next
            rm -rf ${{ env.DEPLOY_PATH }}/builds/${{ inputs.brand }}/node_modules

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'deploy/'
          target: '${{ env.DEPLOY_PATH }}/builds/${{ inputs.brand }}'
          strip_components: 1

      - name: Restart PM2 process
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            pm2 restart mp-${{ inputs.brand }} || \
              cd ${{ env.DEPLOY_PATH }} && pm2 start ecosystem.config.js --only mp-${{ inputs.brand }}
            pm2 save
